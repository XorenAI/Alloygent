[project]
name = "alloygent"
version = "0.1.1"
description = "A typed Python library for building agent workflows from plain functions."
readme = "README.md"
authors = [
    { name = "Jit Debnath", email = "jit.nathdeb@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["agents", "ai", "orchestration", "typed", "workflow"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/XorenAI/Alloygent"
Repository = "https://github.com/XorenAI/Alloygent"
Issues = "https://github.com/XorenAI/Alloygent/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/alloygent"]

[dependency-groups]
dev = [
    "isort>=8.0.1",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.isort]
profile = "black"
